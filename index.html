<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京时间</title>
    <style>
        /* 全局样式重置与居中设置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 使内容垂直水平居中 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }

        /* 时间文本样式 */
        .beijing-time {
            color: #ff0000; /* 红色 */
            font-size: 6rem; /* 大字大小，响应式适配 */
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); /* 轻微阴影增强视觉效果 */
            letter-spacing: 2px; /* 字符间距优化 */
        }

        /* 响应式适配（手机端） */
        @media (max-width: 768px) {
            .beijing-time {
                font-size: 3rem; /* 手机端缩小字体 */
            }
        }
    </style>
</head>
<body>
    <div class="beijing-time" id="timeDisplay"></div>

    <script>
        // 函数：获取并格式化北京时间
        function getBeijingTime() {
            // 创建北京时间（UTC+8）对象
            const now = new Date();
            // 转换为北京时间字符串（包含日期和时间，格式优化）
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                timeZone: 'Asia/Shanghai',
                hour12: false // 24小时制
            };
            return now.toLocaleString('zh-CN', options);
        }

        // 初始化显示时间
        document.getElementById('timeDisplay').textContent = getBeijingTime();

        // 每秒更新一次时间（实时刷新）
        setInterval(() => {
            document.getElementById('timeDisplay').textContent = getBeijingTime();
        }, 1000);
    </script>
</body>
</html>
